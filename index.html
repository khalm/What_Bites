<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2530">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WhatBites">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>WhatBites</title>
  <link rel="manifest" href="manifest.json?v=20">
  <link rel="icon" href="icon.svg?v=8" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png?v=8">
  <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-inner">
      <img src="icon.svg?v=8" alt="" class="splash-icon">
      <div class="splash-title">WhatBites</div>
      <div class="splash-tag" id="splashTag">Hva biter i dag?</div>
      <div class="splash-ver" id="splashVer"></div>
    </div>
  </div>
  <script>
    // App version — shown on the splash and at the bottom of the front page. Bump on every release.
    window.WB_VERSION = '1.21';
    document.getElementById('splashVer').textContent = 'v' + window.WB_VERSION;
    // Splash: shown ~1500 ms, then fades out. Language tagline set before first paint.
    if ((localStorage.getItem('wb_ui') || 'no') === 'en') document.getElementById('splashTag').textContent = 'What bites today?';
    setTimeout(function () {
      var s = document.getElementById('splash'); s.classList.add('gone');
      setTimeout(function () { s.remove(); }, 300);
    }, 1500);
  </script>
  <div id="netBadge" class="net-badge hidden"></div>
  <button id="langBtn" class="lang-float" aria-label="Language"><span class="flag" id="langFlag">🇬🇧</span><span id="langCode">EN</span></button>

  <main>
    <button id="installTop" class="btn primary install-top hidden" type="button" data-i18n="installBtn"></button>
    <p id="iosInstall" class="note hidden"></p>
    <section class="card banner hidden" id="modelBanner">
      <p><b data-i18n="bannerTitle"></b><br><span class="muted" id="bannerText"></span></p>
      <div class="bar hidden" id="bannerBar"><div id="bannerFill"></div></div>
      <div class="row">
        <button class="btn ghost" id="bannerLater" data-i18n="later"></button>
        <button class="btn primary" id="bannerGo" data-i18n="downloadNow"></button>
      </div>
    </section>

    <section class="card" id="step1">
      <div class="step-head"><span class="num">1</span><h2 data-i18n="s1title"></h2></div>
      <p class="muted" id="condStatus" data-i18n="s1intro"></p>
      <button class="btn" id="locBtn" data-i18n="useLoc"></button>
      <details class="plan" id="planBox">
        <summary data-i18n="planTitle"></summary>
        <p class="tiny muted" data-i18n="planHint"></p>
        <div class="row"><input id="planQ" type="search" autocomplete="off"><button type="button" class="btn" id="planGo" data-i18n="planSearch"></button></div>
        <ul class="plan-results" id="planResults"></ul>
        <p class="tiny" id="planStatus"></p>
        <ul class="trips" id="tripList"></ul>
      </details>
      <div id="conditions" class="hidden">
        <div class="place" id="placeName"></div>
        <div class="grid" id="weatherGrid"></div>
        <h3 data-i18n="fishNearby"></h3>
        <p class="tiny muted" data-i18n="fishTap"></p>
        <div id="prefLine" class="pref hidden"></div>
        <div class="chips" id="fishList"></div>
        <p class="tiny muted" data-i18n="fishSource"></p>
      </div>
    </section>

    <section class="card" id="step2">
      <div class="step-head"><span class="num">2</span><h2 data-i18n="s2title"></h2></div>
      <p class="muted" data-i18n="s2intro"></p>
      <ul class="checklist" id="checklist"></ul>
      <div id="spotNotes"></div>
      <div class="ask" id="spotAsk"></div>
      <div class="photo-btns">
        <label class="btn" id="ovBtn"><span data-i18n="ovBtn"></span>
          <input type="file" accept="image/*" capture="environment" id="ovInput" hidden></label>
        <label class="btn" id="cuBtn"><span data-i18n="cuBtn"></span>
          <input type="file" accept="image/*" capture="environment" id="cuInput" hidden></label>
      </div>
      <button type="button" class="btn ghost hidden" id="skipSky" data-i18n="skipSky"></button>
      <div class="thumbs" id="spotThumbs"></div>
      <details class="fix" id="fixBox">
        <summary data-i18n="fixHere"></summary>
        <h3 data-i18n="water"></h3><div class="seg" data-group="water"></div>
        <h3 data-i18n="clarity"></h3><div class="seg" data-group="clarity"></div>
        <h3 data-i18n="light"></h3><div class="seg" data-group="light"></div>
        <p class="tiny muted" data-i18n="segHelp"></p>
      </details>
    </section>

    <section class="card" id="step3">
      <div class="step-head"><span class="num">3</span><h2 data-i18n="s3title"></h2></div>
      <p class="muted" data-i18n="s3intro"></p>
      <button type="button" class="btn primary" id="baitBtn"><span data-i18n="s3btn"></span></button>
      <input type="file" accept="image/*" id="baitInput" hidden>
      <p class="tiny muted" id="modelNote"></p>
      <div id="baitStage" class="stage hidden"><canvas id="baitCanvas"></canvas></div>
      <div id="baitResult" class="result hidden"></div>
    </section>

    <p class="tiny muted center" data-i18n="disclaimer"></p>
<div class="share-app-wrap" style="text-align:center;margin:18px 0 8px"><button type="button" class="share-app-btn" style="display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:15px;font-weight:700;cursor:pointer;opacity:.85"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>Del appen med noen</span></button></div>
    <p class="tiny muted center version" id="appVersion"></p>
  </main>

  <div id="camera" class="camera hidden">
    <video id="camVideo" playsinline muted></video>
    <div class="cam-guide"></div>
    <p class="cam-hint" id="camHint"></p>
    <button type="button" class="cam-close" id="camClose" data-i18n-aria="camClose">✕</button>
    <div class="cam-bar">
      <button type="button" class="cam-side" id="camGallery"><span>🖼️</span><small data-i18n="camGallery"></small></button>
      <button type="button" class="cam-shoot" id="camShoot" data-i18n-aria="camShoot"></button>
      <button type="button" class="cam-side cam-torch hidden" id="camTorch" aria-pressed="false"><span>🔦</span><small id="camTorchLbl"></small></button>
    </div>
  </div>

  <div id="busy" class="busy hidden"><img src="icon.svg?v=8" alt="" class="busy-icon"><p id="busyText"></p>
    <div class="bar hidden" id="busyBar"><div id="busyFill"></div></div></div>

  <dialog id="sheet">
    <div class="sheet-img" id="sheetImgWrap"><img id="sheetImg" alt=""></div>
    <h2 id="sheetTitle"></h2>
    <p class="muted"><i id="sheetSci"></i></p>
    <p id="sheetText"></p>
    <p id="sheetSize" class="muted"></p>
    <button class="btn primary" id="sheetPick"></button>
    <a class="btn ghost" id="sheetWiki" target="_blank" rel="noopener"></a>
    <button class="btn ghost" id="sheetClose" data-i18n="close"></button>
  </dialog>

  <script src="engine.js?v=20"></script>
  <script src="scene.js?v=20"></script>
  <script src="trip.js?v=20"></script>
  <script src="vision.js?v=20"></script>
  <script src="app.js?v=20"></script>
<script>/* Share this app */(function(){var NAME="WhatBites",TEXT="WhatBites hjelper deg \u00e5 velge riktig agn n\u00e5r du fisker.",URL0="https://khalm.github.io/What_Bites/",COPIED="Lenken er kopiert \u2013 lim den inn i en melding";function toast(m){var d=document.createElement('div');d.textContent=m;d.setAttribute('role','status');d.style.cssText='position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:11px 18px;border-radius:14px;font:600 15px system-ui,sans-serif;z-index:2147483647;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)';document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}window.shareThisApp=async function(){var url=/github\.io$/.test(location.hostname)?new URL('./',location.href).href:URL0;if(navigator.share){try{await navigator.share({title:NAME,text:TEXT,url:url});return}catch(e){if(e&&e.name==='AbortError')return}}try{await navigator.clipboard.writeText(TEXT+' '+url);toast(COPIED)}catch(e){window.prompt('',url)}};document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('.share-app-btn');if(b){e.preventDefault();window.shareThisApp()}})})();</script>
</body>
</html>
